// Add this block inside the root android/build.gradle of the APP that uses
// thermal_printer, blue_thermal_printer, and bluetooth_thermal_printer.
// Place it after allprojects { } and before any apply plugin lines (or merge
// into an existing subprojects { } block).
//
// This forces all plugin modules to use Java 17 and Kotlin JVM target 17,
// fixing: "Inconsistent JVM-target compatibility detected for tasks
// 'compileDebugJavaWithJavac' (1.8) and 'compileDebugKotlin' (21)"

subprojects { subproject ->
    subproject.afterEvaluate {
        if (subproject.plugins.hasPlugin("com.android.library")) {
            subproject.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
        }
    }
}
